<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operacional Mini Bar</title><style>
:root{--navy:#071d3b;--navy2:#0d2d55;--gold:#d8b46a;--bg:#f4f7fb;--text:#172033;--muted:#687386;--green:#1f9d62;--red:#c73b45;--yellow:#d9a516;--purple:#7656b8;--blue:#2676d8;--orange:#e17d22;--white:#fff;--shadow:0 8px 25px #071d3b16}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;transition:transform .08s ease,opacity .08s ease,background-color .12s ease}button:active{transform:scale(.985);opacity:.92}.nav button,.primary,.success,.danger,.role,.staffs button{min-height:44px;touch-action:manipulation}.top{background:#fff;color:var(--navy);padding:15px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #dfe5ec;box-shadow:0 2px 10px #071d3b08}.logo{width:145px;max-height:48px;object-fit:contain;object-position:left}.top h1{font-size:18px;margin:0;color:var(--navy)}.top small{display:block;opacity:.7;margin-top:3px}.wrap{max-width:1250px;margin:auto;padding:18px}.login{max-width:640px;margin:48px auto;background:#fff;border-radius:22px;padding:34px 30px;box-shadow:0 14px 40px #071d3b12;border:1px solid #e2e8f0}.login img{width:190px;background:transparent;padding:0;border-radius:0;display:block;margin:0 auto 22px}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}.role{padding:20px;border-radius:14px;background:#fff;border:1px solid #d9e0e8;text-align:left;display:flex;align-items:center;gap:14px;min-height:92px}.role-icon{width:40px;height:40px;flex:0 0 40px;border-radius:11px;background:#f3f6f9;color:#294766;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #dfe6ee}.role-icon svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.55;fill:none;stroke-linecap:round;stroke-linejoin:round}.role b{display:block;font-size:16px;color:var(--navy)}.role span{font-size:12px;color:var(--muted);display:block;margin-top:4px}.login h2{text-align:center;color:var(--navy);font-size:26px;margin:0 0 8px}.login>.muted{text-align:center;max-width:500px;margin:0 auto}.staffs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.staffs button{background:var(--navy);color:#fff;padding:10px 13px;border-radius:10px}.hidden{display:none!important}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:12px 0;border-bottom:1px solid #e2e7ee}.nav button{background:#fff;border:1px solid #dbe2eb;color:#30445d;padding:10px 14px;border-radius:10px}.nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow)}.metric{font-size:27px;font-weight:700;margin-top:6px}.muted{color:var(--muted);font-size:13px}.section{margin-bottom:16px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form .wide{grid-column:span 2}.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #d8e0ea;border-radius:10px;background:#fff}.form textarea{min-height:70px}.primary{background:var(--navy);color:#fff;padding:11px 15px;border-radius:10px}.navbtn{background:#fff;color:var(--navy);border:1px solid #d8e0ea;padding:9px 13px;border-radius:9px}.danger{background:var(--red);color:#fff;padding:10px 12px;border-radius:9px}.success{background:var(--green);color:#fff;padding:10px 12px;border-radius:9px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;color:#fff;font-size:11px;font-weight:700}.t-red{background:var(--red)}.t-yellow{background:var(--yellow)}.t-purple{background:var(--purple)}.t-blue{background:var(--blue)}.t-green{background:var(--green)}.t-orange{background:var(--orange)}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border-radius:14px;padding:13px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:10px;align-items:center}.item .actions{display:flex;gap:6px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:14px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:20}.pin{max-width:330px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:15}.modal>div{background:#fff;border-radius:18px;padding:24px;width:min(420px,92vw)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:span 2}.top{position:static}.wrap{padding:12px}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.roles{grid-template-columns:1fr}.form{grid-template-columns:1fr}.form .wide{grid-column:span 1}.item{align-items:flex-start;flex-direction:column}.item .actions{width:100%}.item .actions button{flex:1}.logo{width:135px}}

/* Tema padrão Gran Villagio: azul-marinho e branco */
body{background:#071d3b;color:#fff}
.top{background:#0d2d55;color:#fff;border-bottom:1px solid #294766}
.top h1{color:#fff}.top small{color:#e1eaf4!important}
.login{background:#0d2d55;color:#fff;border-color:#294766}
.login h2,.login p{color:#fff}
.role{background:#071d3b;border-color:#36516f;color:#fff}
.role b,.role span{color:#fff}
.role-icon{background:#0d2d55;color:#fff;box-shadow:inset 0 0 0 1px #36516f}
.nav{border-bottom-color:#36516f}
.nav button,.navbtn{background:#0d2d55;border-color:#36516f;color:#fff}
.nav button.active{background:#fff;color:#071d3b;border-color:#fff}
.card,.item,.modal>div{background:#0d2d55;color:#fff}
.muted{color:#c4d0df}
.form input,.form select,.form textarea{background:#071d3b;color:#fff;border-color:#36516f}
.form input::placeholder,.form textarea::placeholder{color:#c4d0df}
.login>div[style*="background:#d9e0e8"],.login>div[style*="background:#e2e7ee"]{background:#36516f!important}
body.theme-light{background:#f4f7fb;color:#172033}
body.theme-light .top{background:#fff;color:#071d3b;border-bottom:1px solid #dfe5ec}
body.theme-light .top h1{color:#071d3b}
body.theme-light .top small{color:#7b8798!important}
body.theme-light .login{background:#fff;color:#172033;border-color:#e2e8f0}
body.theme-light .login h2{color:#071d3b}
body.theme-light .login p{color:#687386}
body.theme-light .role{background:#fff;border-color:#d9e0e8;color:#172033}
body.theme-light .role b{color:#071d3b}
body.theme-light .role span{color:#687386}
body.theme-light .role-icon{background:#f3f6f9;color:#294766;box-shadow:inset 0 0 0 1px #dfe6ee}
body.theme-light .nav{border-bottom-color:#e2e7ee}
body.theme-light .nav button,body.theme-light .navbtn{background:#fff;border-color:#dbe2eb;color:#30445d}
body.theme-light .nav button.active{background:#071d3b;color:#fff;border-color:#071d3b}
body.theme-light .card,body.theme-light .item,body.theme-light .modal>div{background:#fff;color:#172033}
body.theme-light .muted{color:#687386}
body.theme-light .form input,body.theme-light .form select,body.theme-light .form textarea{background:#fff;color:#172033;border-color:#d8e0ea}
body.theme-light .form input::placeholder,body.theme-light .form textarea::placeholder{color:#687386}
.theme-toggle{margin-right:8px}
</style></head><body>
<div id="login" class="login"><img src="/logo-gran-villagio-azul.png"><div style="height:1px;background:#d9e0e8;width:48px;margin:0 auto 20px"></div><h2>Operacional Mini Bar</h2><p class="muted">Selecione o setor para continuar.</p><div class="roles"><button class="role" onclick="enter('Recepção')"><span class="role-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M6 12h16v10H6z"/><path d="M8 12V9.5a6 6 0 0 1 12 0V12"/><path d="M14 16v3"/></svg></span><div><b>Recepção</b><span>Operações e solicitações</span></div></button><button class="role" onclick="enter('Governança')"><span class="role-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 21h18"/><path d="M7 21v-8h14v8"/><path d="M9 13V9h10v4"/><path d="M11 9V6h6v3"/></svg></span><div><b>Governança</b><span>Controle de apartamentos</span></div></button><button class="role" onclick="enter('Gerência')"><span class="role-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M6 21V7"/><path d="M6 21h17"/><path d="M10 18v-5"/><path d="M14 18V9"/><path d="M18 18v-7"/><path d="M22 18V5"/></svg></span><div><b>Gerência</b><span>Gestão e relatórios</span></div></button><button class="role" onclick="enter('Mini Bar')"><span class="role-icon" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M8 8h12v14H8z"/><path d="M11 8V6h6v2"/><path d="M11 12h6"/><path d="M11 16h4"/><path d="M11 20h3"/></svg></span><div><b>Mini Bar</b><span>Conferências e atendimento</span></div></button></div><div style="margin-top:22px;padding-top:20px;border-top:1px solid #e2e7ee"><button class="primary" style="width:100%;background:#fff;color:var(--navy);border:1px solid #cbd5e1" onclick="adminLogin()">Administração Antonio</button></div><p style="text-align:center;color:#9aa5b4;font-size:11px;margin:18px 0 0">Gran Villagio · Sistema interno</p></div>
<div id="app" class="hidden"><header class="top"><img class="logo" src="/logo-gran-villagio-azul.png"><div><h1>Operacional Mini Bar</h1><small id="who"></small><small style="display:block;margin-top:3px;color:#7b8798">V11 • CONFIGURAÇÃO / PERSONALIZAÇÃO</small></div><div style="margin-left:auto"><button id="themeToggle" class="navbtn theme-toggle" onclick="toggleTheme()">Tema claro</button><button class="navbtn" onclick="logout()">Sair</button></div></header><main class="wrap"><div id="nav" class="nav"></div><div id="content"></div></main></div><div id="toast" class="toast"></div><div id="tutorialBanner" class="hidden" style="position:fixed;left:12px;right:12px;bottom:12px;z-index:25;background:#071d3b;color:#fff;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px #071d3b30"><span style="flex:1"><b>Modo demonstração</b> · Tutorial ativo: clique nas funções para ver como elas funcionam</span><button class="navbtn" style="color:#071d3b" onclick="tutorialEnabled=!tutorialEnabled;this.textContent=tutorialEnabled?'Tutorial ativo':'Tutorial pausado'">Tutorial ativo</button></div><div id="tutorialModal" class="modal hidden" onclick="if(event.target===this)this.classList.add('hidden')"><div><h3 id="tutorialTitle" style="margin-top:0;color:#071d3b">Como funciona</h3><p id="tutorialText" class="muted" style="font-size:14px;line-height:1.55"></p><button class="primary" onclick="$('tutorialModal').classList.add('hidden')">Entendi</button></div></div>
<script>
const DEMO_MODE=true; let tutorialEnabled=true; let state={sector:'',user:'',rooms:[],products:[],staff:[],tab:'inicio',adminToken:'',activeConference:null};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function applyTheme(){const light=localStorage.getItem('gv-theme')==='light';document.body.classList.toggle('theme-light',light);const b=$('themeToggle');if(b)b.textContent=light?'Tema azul-marinho':'Tema claro'}function toggleTheme(){const light=!document.body.classList.contains('theme-light');document.body.classList.toggle('theme-light',light);localStorage.setItem('gv-theme',light?'light':'navy');const b=$('themeToggle');if(b)b.textContent=light?'Tema azul-marinho':'Tema claro'}applyTheme();
async function api(url,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(state.adminToken)headers['x-admin-token']=state.adminToken;const r=await fetch(url,{headers,...opt});const j=await r.json();if(!r.ok)throw new Error(j.error||'Erro');return j}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A();const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.18)}catch{}}function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';beep();setTimeout(()=>x.style.display='none',3200)}
async function verifySectorPassword(sector){if(DEMO_MODE)return true;const status=await api('/api/sector/verify',{method:'POST',body:JSON.stringify({sector,password:''})});if(!status.configured)return true;const pass=prompt('Digite a senha do '+sector+'.');if(pass===null)return false;const r=await api('/api/sector/verify',{method:'POST',body:JSON.stringify({sector,password:pass})});if(!r.ok){toast('Senha incorreta.');return false}return true}
async function enter(sector){try{if(!await verifySectorPassword(sector))return;state.sector=sector;if(sector==='Recepção'){state.user='';state.tab='inicio';return showApp()}if(sector==='Mini Bar'){const staff=state.staff.filter(x=>x.sector==='Mini Bar');return chooseStaff(staff,'Mini Bar')}state.user=sector;showApp()}catch(e){toast(e.message)}}
function chooseStaff(list,sector){$('login').innerHTML='<img src="/logo-gran-villagio-azul.png" style="width:190px;background:transparent;padding:0;border-radius:0;display:block;margin:0 auto 22px"><h2>'+esc(sector)+'</h2><p class="muted">Selecione o nome de quem está usando o sistema:</p><div class="staffs">'+list.map(x=>`<button onclick='selectUser(${JSON.stringify(x.name)})'>${esc(x.name)}</button>`).join('')+'</div><p style="margin-top:18px"><button class="navbtn" onclick="location.reload()">Voltar</button></p>'}
function selectUser(name){state.user=name;showApp()}
function receptionUserControl(){if(state.sector!=='Recepção')return '';const list=state.staff.filter(x=>x.sector==='Recepção');return '<label style="font-size:12px;color:#687386;display:flex;align-items:center;gap:7px">Atendente <select id="receptionUser" onchange="changeReceptionUser(this.value)" style="padding:7px 9px;border:1px solid #d8e0ea;border-radius:9px;background:#fff;color:#071d3b;font-weight:600"><option value="">Selecione</option>'+list.map(x=>'<option value="'+esc(x.name)+'" '+(state.user===x.name?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label>'}
function changeReceptionUser(name){state.user=name||'';$('who').innerHTML='Recepção • '+(state.user?esc(state.user):'Atendente não selecionado')+' '+receptionUserControl();if(state.user)toast('Atendente selecionado: '+state.user);render()}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('tutorialBanner').classList.remove('hidden');if(state.sector==='Recepção')$('who').innerHTML='Recepção • '+(state.user?esc(state.user):'Atendente não selecionado')+' '+receptionUserControl();else $('who').textContent=`${state.sector} • ${state.user}`;buildNav();render();subscribe()}
function mustHaveUser(){if(state.sector==='Recepção'&&!state.user){toast('Selecione o atendente no topo antes de continuar.');return false}return true}
function buildNav(){if(state.tab!=='conferencias')state.activeConference=null;let tabs=['inicio'];if(state.sector==='Recepção')tabs.push('solicitacoes','saidas','conferencia','prorrogacoes','ocorrencias-recepcao','chat','perdas','nao-reconhecido');if(state.sector==='Mini Bar')tabs.push('fila','conferencias','ocorrencias','chat','perdas');if(state.sector==='Governança')tabs.push('ocorrencias','chat');if(state.sector==='Gerência')tabs.push('dashboard','perdas','historico','chat');if(state.sector==='Admin')tabs.push('dashboard','perdas','equipe','config');$('nav').innerHTML=tabs.map(t=>`<button class="${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${label(t)}</button>`).join('')}
function label(t){return {inicio:'Início',solicitacoes:'Solicitações',saidas:'Saídas pendentes',conferencia:'Conferir minibar',prorrogacoes:'Prorrogações','ocorrencias-recepcao':'Acessos / Não perturbe',chat:'💬 Comunicação','nao-reconhecido':'Não reconhecido',fila:'Fila do Mini Bar',conferencias:'Conferências',ocorrencias:'Acesso aos quartos',perdas:'Controle de perdas',dashboard:'Dashboard',historico:'Histórico',equipe:'Equipe',config:'Configuração / Personalização'}[t]||t}
async function render(){try{const d=await api('/api/dashboard');let h='';if(state.tab==='inicio')h=await Promise.resolve(home(d));if(state.tab==='solicitacoes')h=await Promise.resolve(requestForm());if(state.tab==='saidas')h=await Promise.resolve(saidasView());if(state.tab==='conferencia')h=await Promise.resolve(conferenceRequestForm());if(state.tab==='prorrogacoes')h=await Promise.resolve(extensionForm());if(state.tab==='ocorrencias-recepcao')h=await Promise.resolve(receptionOccurrencesView());if(state.tab==='chat')h=await Promise.resolve(chatView());if(state.tab==='nao-reconhecido')h=await Promise.resolve(nonRecognizedForm());if(state.tab==='fila')h=await Promise.resolve(requestList(true));if(state.tab==='conferencias')h=await Promise.resolve(conferenceList());if(state.tab==='ocorrencias')h=await Promise.resolve(occurrenceView());if(state.tab==='perdas')h=await Promise.resolve(lossView());if(state.tab==='dashboard')h=await Promise.resolve(dashboardView(d));if(state.tab==='historico')h=await Promise.resolve(historyView());if(state.tab==='equipe')h=await Promise.resolve(teamView());if(state.tab==='config')h=await Promise.resolve(configView());$('content').innerHTML=String(h??'');wire();}catch(e){$('content').innerHTML='<div class="card">Erro ao carregar: '+esc(e.message)+'</div>'}}
function home(d){let cards='';if(state.sector==='Recepção')cards=`<div class="grid"><div class="card"><span class="muted">Solicitações pendentes</span><div class="metric">${d.pendingRequests}</div></div><div class="card"><span class="muted">Conferências pendentes</span><div class="metric">—</div></div></div>`;else if(state.sector==='Governança')cards=`<div class="grid"><div class="card"><span class="muted">Ocorrências abertas</span><div class="metric">${d.pendingOccurrences}</div></div></div>`;else cards=`<div class="grid"><div class="card"><span class="muted">Solicitações pendentes</span><div class="metric">${d.pendingRequests}</div></div><div class="card"><span class="muted">Ocorrências abertas</span><div class="metric">${d.pendingOccurrences}</div></div><div class="card"><span class="muted">Perdas hoje</span><div class="metric">${d.lossesToday}</div></div><div class="card"><span class="muted">Valor de perdas</span><div class="metric">R$ ${d.totalLoss.toFixed(2).replace('.',',')}</div></div></div>`;return cards+`<div class="card section" style="margin-top:16px"><h2>Bem-vindo, ${esc(state.user)}</h2><p class="muted">Sistema local do Gran Villagio. As informações ficam nesta máquina e podem ser compartilhadas pela rede local do hotel.</p></div>`}
function roomSelect(id='room'){return `<select id="${id}"><option value="">Apartamento</option>${state.rooms.map(r=>`<option>${r}</option>`).join('')}</select>`}
async function conferenceRequestForm(){const arr=await api('/api/conferences');const mine=arr.filter(x=>x.requester===state.user || x.status==='concluida').slice(0,30);return `<div class="card"><h2>Solicitar conferência de minibar</h2><p class="muted">A recepção solicita; o Mini Bar confere e devolve os itens consumidos e o valor.</p><div class="form"><div>${roomSelect()}</div><div><select id="operation"><option>Check-out — conferir minibar</option><option>Liberar hóspede + solicitar conferência</option><option>Check-in — estabelecer quantidade inicial</option><option>Conferência</option></select></div><div class="wide"><input id="cnote" placeholder="Observação"></div></div><button class="primary" onclick="createConference()">Solicitar ao Mini Bar</button></div><div class="card" style="margin-top:16px"><h2>Resultados do Mini Bar</h2><p class="muted">Quando o Mini Bar finalizar uma conferência, o resultado aparece aqui automaticamente.</p><div class="list" style="margin-top:12px">${mine.map(x=>{const cls=x.status==='concluida'?'t-green':x.status==='em andamento'?'t-blue':'t-yellow';const items=x.items?.length?x.items.map(i=>`${i.qty}x ${esc(i.name)}`).join(' • '):'Nenhum consumo lançado';return `<div class="item"><div><b>Apto ${esc(x.room)}</b> • ${esc(x.operation)}<br><span class="muted">${x.status==='concluida'?'Resultado recebido do Mini Bar':'Aguardando conferência do Mini Bar'}<br>${items}</span><br><strong>R$ ${Number(x.total||0).toFixed(2).replace('.',',')}</strong>Solicitado por ${esc(x.requester||'—')} • ${new Date(x.updatedAt||x.createdAt).toLocaleString('pt-BR')}</span><br><b>Consumo:</b> ${items}<br><b>Total:</b> R$ ${Number(x.total||0).toFixed(2).replace('.',',')}</div><div class="actions"><span class="tag ${cls}">${esc(x.status)}</span></div></div>`}).join('')||'<p class="muted">Nenhum resultado recebido ainda.</p>'}</div></div>`}

async function createConference(){if(!mustHaveUser())return;try{await api('/api/conferences',{method:'POST',body:JSON.stringify({room:$('room').value,operation:$('operation').value,note:$('cnote').value,requester:state.user})});toast('Conferência enviada ao Mini Bar');render()}catch(e){toast(e.message)}}
async function conferenceList(){const arr=await api('/api/conferences');return `<div class="card"><h2>Fila de conferências</h2><p class="muted">Conferências em andamento podem ser retomadas sem perder os itens já lançados.</p><div class="list" style="margin-top:12px">${arr.map(x=>{const cls=x.status==='concluida'?'t-green':x.status==='divergencia'?'t-red':x.status==='em andamento'?'t-blue':'t-yellow';const btn=x.status==='pendente'?`<button class="primary" onclick="openConference(${x.id})">CONFERIR</button>`:x.status==='em andamento'?`<button class="primary" onclick="openConference(${x.id})">CONTINUAR</button>`:'';return `<div class="item"><div><b>Apto ${x.room}</b> • ${x.operation}<br><span class="muted">${x.requester} • ${new Date(x.createdAt).toLocaleString('pt-BR')} • ${x.note||''}</span><br>${x.items?.length?x.items.map(i=>`${i.qty}x ${i.name}`).join(' • '):'Sem itens lançados ainda'}</div><div class="actions">${btn}<span class="tag ${cls}">${x.status}</span></div></div>`}).join('')||'<p class="muted">Nenhuma conferência.</p>'}</div></div>`}
async function openConference(id){const arr=await api('/api/conferences');const x=arr.find(a=>a.id===id);if(!x)return;state.activeConference=id;let items=x.items||[];$('content').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin-bottom:4px">Conferência • Apto ${x.room}</h2><p class="muted">${x.operation} • ${x.status}</p></div><button class="navbtn" onclick="state.activeConference=null;state.tab='conferencias';render()">VOLTAR À FILA</button></div><div class="list" style="margin-top:14px">${state.products.map((p,i)=>{const q=(items.find(a=>a.name===p.name)||{}).qty||0;return `<div class="item"><div><b>${p.name}</b><br><span class="muted">R$ ${p.price.toFixed(2).replace('.',',')}</span></div><div class="actions"><button type="button" class="navbtn" onclick="changeItem(${id},${i},-1)">−</button><b id="q${i}">${q}</b><button type="button" class="navbtn" onclick="changeItem(${id},${i},1)">+</button></div></div>`}).join('')}</div><button type="button" class="success" style="margin-top:14px" onclick="finishConference(${id})">ENVIAR RESULTADO</button></div>`}
async function changeItem(id,i,delta){try{const arr=await api('/api/conferences');const x=arr.find(a=>a.id===id);if(!x)return;let items=(x.items||[]).map(a=>({...a}));let row=items.find(a=>a.name===state.products[i].name);if(!row){row={name:state.products[i].name,price:state.products[i].price,qty:0};items.push(row)}row.qty=Math.max(0,(Number(row.qty)||0)+delta);items=items.filter(a=>a.qty>0);await api('/api/conferences/'+id,{method:'PATCH',body:JSON.stringify({items,assignee:state.user,status:'em andamento'})});const q=document.getElementById('q'+i);if(q)q.textContent=String((items.find(a=>a.name===state.products[i].name)||{}).qty||0);toast(`${state.products[i].name}: ${(items.find(a=>a.name===state.products[i].name)||{}).qty||0}`);}catch(e){toast(e.message)}}
async function finishConference(id){try{const arr=await api('/api/conferences');const x=arr.find(a=>a.id===id);if(!x)return;const items=x.items||[];const total=items.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);await api('/api/conferences/'+id,{method:'PATCH',body:JSON.stringify({items,status:'concluida',assignee:state.user})});state.activeConference=null;toast(`Conferência concluída • R$ ${total.toFixed(2).replace('.',',')}`);state.tab='conferencias';render()}catch(e){toast(e.message)}}
function nonRecognizedForm(){return `<div class="card"><h2>Não reconhecido pelo hóspede</h2><p class="muted">Área exclusiva da Recepção para registrar uma contestação de cobrança de minibar.</p><div class="form"><div>${roomSelect()}</div><div class="wide"><input id="prod" placeholder="Produto contestado"></div><div class="wide"><textarea id="lnote" placeholder="Observação"></textarea></div></div><button class="danger" onclick="createNonRecognized()">REGISTRAR NÃO RECONHECIDO</button></div>`}
async function createNonRecognized(){if(!mustHaveUser())return;try{await api('/api/losses',{method:'POST',body:JSON.stringify({type:'Não Reconhecido',room:$('room').value,product:$('prod').value,quantity:1,unitPrice:0,note:$('lnote').value,responsible:state.user})});toast('Não reconhecido registrado');render()}catch(e){toast(e.message)}}
function requestForm(){return `<div class="card"><h2>Nova solicitação</h2><div class="form"><div>${roomSelect()}</div><div><select id="type"><option>Copos</option><option>Água</option><option>Refrigerante</option><option>Chocolate</option><option>Reposição de minibar</option><option>Outro item</option></select></div><div><input id="qty" type="number" min="1" value="1" placeholder="Quantidade"></div><div><select id="priority"><option value="normal">Solicitação comum</option><option value="prioridade">Prioridade</option><option value="urgente">Urgente</option></select></div><div class="wide"><textarea id="note" placeholder="Observação"></textarea></div></div><button class="primary" onclick="createRequest()">Enviar para o Mini Bar</button></div><div class="card" style="margin-top:16px"><h3>Atalhos</h3><p class="muted">Para urgências, selecione a prioridade. O Mini Bar receberá uma notificação na hora.</p></div>`}
async function createRequest(){if(!mustHaveUser())return;try{await api('/api/requests',{method:'POST',body:JSON.stringify({kind:'operacional',room:$('room').value,type:$('type').value,quantity:$('qty').value,priority:$('priority').value,note:$('note').value,requester:state.user})});toast('Solicitação enviada ao Mini Bar');render()}catch(e){toast(e.message)}}
function extensionForm(){return `<div class="card"><h2>Prorrogação de hospedagem</h2><p class="muted">Informe ao Mini Bar os quartos que prorrogaram a hospedagem hoje.</p><div class="form"><div>${roomSelect()}</div><div><input id="newDate" type="date"></div><div class="wide"><input id="note" placeholder="Observação"></div></div><button class="primary" onclick="createExtension()">Registrar prorrogação</button></div><div class="card" style="margin-top:16px"><h3>Prorrogações recentes</h3><div id="extList">Carregando...</div></div>`}
async function createExtension(){if(!mustHaveUser())return;try{await api('/api/extensions',{method:'POST',body:JSON.stringify({room:$('room').value,newDate:$('newDate').value,note:$('note').value,requester:state.user})});toast('Prorrogação enviada ao Mini Bar');render()}catch(e){toast(e.message)}}
async function requestList(mini){const arr=await api('/api/requests');let data=mini?arr:arr.filter(x=>x.requester===state.user||x.kind==='saida_pendente');return `<div class="card"><h2>${mini?'Fila do Mini Bar':'Solicitações'}</h2><div class="list" style="margin-top:12px">${data.map(x=>{let actions='';if(mini&&x.kind==='saida_pendente'){if(x.status==='nova')actions=`<button class="primary" onclick="reqStatus(${x.id},'em atendimento','${esc(state.user)}')">ASSUMIR</button>`;else if(x.status==='em atendimento')actions=`<button class="success" onclick="openSaida(${x.id})">RESPONDER SAÍDA</button>`;else actions=`<span class="tag t-green">RESPONDIDA</span>`;}else if(mini){if(x.status==='nova')actions=`<button class="primary" onclick="reqStatus(${x.id},'em atendimento','${esc(state.user)}')">ASSUMIR</button>`;else if(x.status==='em atendimento')actions=`<button class="success" onclick="reqStatus(${x.id},'concluida','${esc(state.user)}')">CONCLUÍDO</button>`;else actions=`<span class="tag t-green">CONCLUÍDA</span>`;}else{actions=`<span class="tag ${x.status==='concluida'||x.status==='respondida'?'t-green':x.status==='em atendimento'?'t-blue':'t-yellow'}">${esc(x.status)}</span>`;}return `<div class="item"><div><b>Apto ${esc(x.room||'—')}</b> • ${esc(x.type)} ${x.kind==='saida_pendente'?'<span class="tag t-orange">SAÍDA</span>':''} <span class="tag ${x.priority==='urgente'?'t-red':x.priority==='prioridade'?'t-orange':'t-blue'}">${esc(x.priority)}</span><br><span class="muted">${esc(x.requester)} • ${new Date(x.createdAt).toLocaleString('pt-BR')} • ${esc(x.note)}</span>${x.items?.length?`<br><span class="muted">Consumo: ${x.items.map(i=>`${esc(i.name)} x${i.qty}`).join(', ')} • R$ ${(x.total||0).toFixed(2).replace('.',',')}</span>`:''}</div><div class="actions">${actions}</div></div>`}).join('')||'<p class="muted">Nenhuma solicitação.</p>'}</div></div>`}
async function reqStatus(id,status,user){try{await api('/api/requests/'+id,{method:'PATCH',body:JSON.stringify({status,assignee:user})});toast('Atualizado');render()}catch(e){toast(e.message)}}
async function saidasView(){return `<div class="card"><h2>🚪 Solicitar saídas pendentes</h2><p class="muted">Selecione os quartos que precisam de conferência pelo Mini Bar.</p><div class="form"><div class="wide"><input id="saidaBusca" placeholder="Filtrar por quarto" oninput="filterSaidas()"></div></div><div id="saidaRooms" class="list" style="margin-top:12px;max-height:360px;overflow:auto">${state.rooms.map(r=>`<label class="item" data-room="${r}" style="cursor:pointer"><span><input type="checkbox" class="saida-room" value="${r}"> Apto ${r}</span><span class="muted">${floorFor(r)}</span></label>`).join('')}</div><button class="primary" onclick="sendSaidas()">Enviar selecionados ao Mini Bar</button></div>`}
function floorFor(r){return `${String(r).slice(0,-2)}º andar`}
function filterSaidas(){const q=($('saidaBusca').value||'').trim();document.querySelectorAll('#saidaRooms [data-room]').forEach(x=>x.style.display=(!q||x.dataset.room.includes(q))?'flex':'none')}
async function sendSaidas(){if(!mustHaveUser())return;const rooms=[...document.querySelectorAll('.saida-room:checked')].map(x=>x.value);if(!rooms.length)return toast('Selecione pelo menos um quarto');try{for(const room of rooms)await api('/api/requests',{method:'POST',body:JSON.stringify({kind:'saida_pendente',room,type:'SAÍDA PENDENTE',priority:'prioridade',note:'Conferir saída solicitada pela Recepção',requester:state.user})});toast(`${rooms.length} saída(s) enviada(s) ao Mini Bar`);render()}catch(e){toast(e.message)}}
async function openSaida(id){const arr=await api('/api/requests');const x=arr.find(y=>y.id===id);if(!x)return;const items=state.products.map((p,i)=>`<div class="item"><span>${esc(p.name)}<br><span class="muted">R$ ${p.price.toFixed(2).replace('.',',')}</span></span><input id="sq${i}" type="number" min="0" value="0" style="width:80px;padding:10px;border:1px solid #d8e0ea;border-radius:10px" data-name="${esc(p.name)}" data-price="${p.price}"></div>`).join('');const situations=['TEM MALAS','APARTAMENTO VAGO LIMPO','APARTAMENTO VAGO SUJO','ENCAMINHADO PARA A RECEPÇÃO','INFORMOU QUE ESTÁ DESCENDO','HÓSPEDE AINDA NO APARTAMENTO','HÓSPEDE SOLICITOU MAIS TEMPO','NÃO FOI POSSÍVEL ENTRAR','NÃO DEIXOU ENTRAR','NÃO PERTURBE','CONFERÊNCIA REALIZADA — SEM CONSUMO','CONFERÊNCIA REALIZADA — COM CONSUMO','DIVERGÊNCIA'];$('content').innerHTML=`<div class="card"><h2>Saída pendente — Apto ${x.room}</h2><div class="form"><div class="wide"><select id="saidaSit">${situations.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="wide"><textarea id="saidaObs" placeholder="Observação"></textarea></div></div><h3>Consumo encontrado</h3><div class="list">${items}</div><button class="success" onclick="saveSaida(${x.id})">Enviar situação e consumo à Recepção</button></div>`}
async function saveSaida(id){if(!mustHaveUser())return;const items=[];state.products.forEach((p,i)=>{const q=Math.max(0,Number($('sq'+i)?.value)||0);if(q)items.push({name:p.name,price:p.price,qty:q})});const total=items.reduce((s,i)=>s+i.price*i.qty,0);try{await api('/api/requests/'+id,{method:'PATCH',body:JSON.stringify({status:'respondida',assignee:state.user,situation:$('saidaSit').value,note:$('saidaObs').value,items,total})});toast('Saída respondida à Recepção');state.tab='fila';render()}catch(e){toast(e.message)}}
async function receptionOccurrencesView(){const arr=(await api('/api/occurrences')).filter(x=>['NÃO PERTURBE','NÃO DEIXOU ENTRAR'].includes(x.type));return `<div class="card"><h2>👀 Quartos com restrição de entrada</h2><p class="muted">Visão operacional para a Recepção evitar perturbar o hóspede.</p><div class="list">${arr.map(x=>`<div class="item"><div><b>Apto ${esc(x.room)}</b> <span class="tag ${x.type==='NÃO PERTURBE'?'t-purple':'t-yellow'}">${esc(x.type)}</span><br><span class="muted">${new Date(x.updatedAt||x.createdAt).toLocaleString('pt-BR')} • ${esc(x.status)}</span></div></div>`).join('')||'<p class="muted">Nenhum quarto sinalizado.</p>'}</div></div>`}
async function chatView(){const targets=state.sector==='Recepção'?['Mini Bar','Governança']:state.sector==='Mini Bar'?['Recepção','Governança']:state.sector==='Governança'?['Recepção','Mini Bar']:['Recepção','Mini Bar','Governança'];const target=window.__chatTarget||targets[0];const msgs=await api('/api/chat?with='+encodeURIComponent(target)+'&sector='+encodeURIComponent(state.sector));const unread=msgs.filter(m=>m.to===state.sector&&!m.readBy.includes(state.sector));if(unread.length){await api('/api/chat/read',{method:'POST',body:JSON.stringify({sector:state.sector,ids:unread.map(x=>x.id)})})}return `<div class="card"><h2>💬 Comunicação</h2><div class="nav">${targets.map(t=>`<button class="${target===t?'active':''}" onclick="window.__chatTarget='${t}';render()">${t}</button>`).join('')}</div><div class="list" style="max-height:420px;overflow:auto">${msgs.map(m=>`<div class="item"><div><b>${esc(m.user)} • ${m.from}</b><br>${esc(m.text)}<br><span class="muted">${new Date(m.createdAt).toLocaleString('pt-BR')} • ${m.readBy.includes(state.sector)?'Lida':'Nova'}</span></div></div>`).join('')||'<p class="muted">Nenhuma mensagem nesta conversa.</p>'}</div><div class="form" style="margin-top:12px"><textarea id="chatText" class="wide" placeholder="Escreva sua mensagem..."></textarea></div><button class="primary" onclick="sendChat('${target}')">Enviar mensagem</button><p class="muted" style="margin-top:10px">Use linguagem profissional. Mensagens ofensivas são bloqueadas automaticamente.</p></div>`}
async function sendChat(to){if(!mustHaveUser())return;const text=$('chatText').value;if(!text.trim())return toast('Digite uma mensagem');try{await api('/api/chat',{method:'POST',body:JSON.stringify({from:state.sector,to,user:state.user,text})});toast('Mensagem enviada');render()}catch(e){toast(e.message)}}
async function occurrenceView(){const arr=await api('/api/occurrences');let h='';if(state.sector==='Mini Bar')h+=`<div class="card section"><h2>Informar problema de acesso</h2><div class="form"><div>${roomSelect()}</div><div><select id="otype"><option>NÃO PERTURBE</option><option>NÃO DEIXOU ENTRAR</option></select></div></div><button class="primary" onclick="createOcc()">Enviar para Governança</button></div>`;h+=`<div class="card"><h2>Ocorrências</h2><div class="list" style="margin-top:12px">${arr.map(x=>`<div class="item"><div><b>Apto ${x.room}</b> <span class="tag ${x.type==='NÃO PERTURBE'?'t-purple':'t-yellow'}">${x.type}</span><br><span class="muted">${new Date(x.createdAt).toLocaleString('pt-BR')} • ${x.reportedBy}</span></div><div class="actions">${state.sector==='Governança'&&x.status!=='deu certo'&&x.status!=='não deu certo'?`<button class="primary" onclick="occStatus(${x.id},'tentar novamente')">TENTAR NOVAMENTE</button>`:''}${state.sector==='Mini Bar'&&x.status==='tentar novamente'?`<button class="success" onclick="occStatus(${x.id},'deu certo')">DEU CERTO</button><button class="danger" onclick="occStatus(${x.id},'não deu certo')">NÃO DEU CERTO</button>`:''}<span class="tag ${x.status==='deu certo'?'t-green':x.status==='não deu certo'?'t-red':x.status==='tentar novamente'?'t-blue':'t-orange'}">${x.status}</span></div></div>`).join('')||'<p class="muted">Nenhuma ocorrência.</p>'}</div></div>`;return h}
async function createOcc(){try{await api('/api/occurrences',{method:'POST',body:JSON.stringify({room:$('room').value,type:$('otype').value,reportedBy:state.user})});toast('Governança foi notificada');render()}catch(e){toast(e.message)}}
async function occStatus(id,status){try{await api('/api/occurrences/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Status atualizado');render()}catch(e){toast(e.message)}}
async function lossView(){const arr=await api('/api/losses');let h=`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">🖨️ Relatório de perdas</h2><p class="muted" style="margin:4px 0 0">Imprime as perdas registradas hoje, respeitando o acesso do setor.</p></div><button class="primary" onclick="printLossReport()">IMPRIMIR RELATÓRIO DE HOJE</button></div></div>`;if(state.sector==='Mini Bar'||state.sector==='Recepção'||state.sector==='Admin')h+=`<div class="card section"><h2>Registrar perda</h2><div class="form"><div><select id="ltype">${state.sector==='Recepção'?'<option>Não Reconhecido</option>':'<option>Quebra</option><option>Não Conferido</option>'}${state.sector==='Admin'?'<option>Não Reconhecido</option>':''}</select></div><div>${roomSelect('lroom')}</div><div><select id="prod">${state.products.map(p=>`<option value="${p.price}">${p.name} — R$ ${p.price.toFixed(2).replace('.',',')}</option>`).join('')}</select></div><div><input id="lqty" type="number" min="1" value="1"></div><div class="wide"><input id="lnote" placeholder="Observação"></div></div><button class="primary" onclick="createLoss()">Registrar ocorrência</button></div>`;if(state.sector==='Recepção')h+=`<div class="card"><h2>Histórico — Não Reconhecido</h2><div class="list" style="margin-top:12px">${arr.filter(x=>x.type==='Não Reconhecido').map(x=>`<div class="item"><div><b>${x.type}</b> • Apto ${x.room||'—'} • ${x.product||'—'}<br><span class="muted">${new Date(x.createdAt).toLocaleString('pt-BR')} • ${x.responsible||''}</span></div><strong>R$ ${(x.quantity*x.unitPrice).toFixed(2).replace('.',',')}</strong></div>`).join('')||'<p class="muted">Nenhum registro.</p>'}</div></div>`;if(state.sector==='Recepção')return h;return h+`<div class="card"><h2>Histórico de perdas</h2><div class="list" style="margin-top:12px">${arr.map(x=>`<div class="item"><div><b>${x.type}</b> • Apto ${x.room||'—'} • ${x.product||'—'}<br><span class="muted">${new Date(x.createdAt).toLocaleString('pt-BR')} • ${x.responsible||''}</span></div><strong>R$ ${(x.quantity*x.unitPrice).toFixed(2).replace('.',',')}</strong></div>`).join('')||'<p class="muted">Nenhuma perda.</p>'}</div></div>`}
async function createLoss(){try{const sel=$('prod');await api('/api/losses',{method:'POST',body:JSON.stringify({type:$('ltype').value,room:$('lroom').value,product:sel.options[sel.selectedIndex].text,quantity:$('lqty').value,unitPrice:sel.value,note:$('lnote').value,responsible:state.user})});toast('Perda registrada');render()}catch(e){toast(e.message)}}
function dashboardView(d){return `<div class="grid"><div class="card"><span class="muted">Quebras / perdas hoje</span><div class="metric">${d.lossesToday}</div></div><div class="card"><span class="muted">Valor total</span><div class="metric">R$ ${d.totalLoss.toFixed(2).replace('.',',')}</div></div><div class="card"><span class="muted">Solicitações abertas</span><div class="metric">${d.pendingRequests}</div></div><div class="card"><span class="muted">Acessos pendentes</span><div class="metric">${d.pendingOccurrences}</div></div></div><div class="card" style="margin-top:16px"><h2>Resumo do dia</h2><p class="muted">O dashboard consolida solicitações, ocorrências e perdas. Os detalhes permanecem disponíveis nas áreas específicas.</p></div>`}
async function historyView(){const [r,o,e,l]=await Promise.all([api('/api/requests'),api('/api/occurrences'),api('/api/extensions'),api('/api/losses')]);return `<div class="grid"><div class="card"><b>${r.length}</b><br><span class="muted">Solicitações</span></div><div class="card"><b>${o.length}</b><br><span class="muted">Ocorrências de acesso</span></div><div class="card"><b>${e.length}</b><br><span class="muted">Prorrogações</span></div><div class="card"><b>${l.length}</b><br><span class="muted">Perdas registradas</span></div></div><div class="card" style="margin-top:16px"><h2>Auditoria</h2><p class="muted">Registros preservam data e hora das operações.</p></div>`}
async function teamView(){const arr=await api('/api/staff/all');return `<div class="card"><h2>Equipe</h2><p class="muted">Gerencie nomes de todos os setores. Inativar preserva o histórico do funcionário.</p><div class="form"><input id="sname" placeholder="Nome"><select id="ssector"><option>Recepção</option><option>Governança</option><option>Gerência</option><option>Mini Bar</option></select><button class="primary" onclick="addStaff()">Adicionar</button></div><div class="list" style="margin-top:16px">${arr.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><br><span class="muted">${esc(x.sector)} • ${x.active?'Ativo':'Inativo'}</span></div><div class="actions"><button class="primary" onclick="editStaff(${x.id},${JSON.stringify(x.name)},${JSON.stringify(x.sector)})">✏️ Editar</button><button class="${x.active?'danger':'primary'}" onclick="toggleStaff(${x.id},${x.active})">${x.active?'🚫 Inativar':'✅ Reativar'}</button></div></div>`).join('')}</div></div>`}
async function addStaff(){try{await api('/api/staff',{method:'POST',body:JSON.stringify({name:$('sname').value,sector:$('ssector').value})});const b=await api('/api/bootstrap');state.staff=b.staff;toast('Funcionário adicionado');render()}catch(e){toast(e.message)}}
async function editStaff(id,name,sector){const n=prompt('Nome do funcionário:',name);if(n===null)return;const ss=prompt('Setor (Recepção, Governança, Gerência ou Mini Bar):',sector);if(ss===null)return;if(!n.trim())return toast('Nome não pode ficar vazio.');if(!['Recepção','Governança','Gerência','Mini Bar'].includes(ss.trim()))return toast('Setor inválido.');try{await api('/api/staff/'+id,{method:'PATCH',body:JSON.stringify({name:n.trim(),sector:ss.trim()})});toast('Funcionário atualizado');render()}catch(e){toast(e.message)}}
async function toggleStaff(id,active){const action=active?'inativar':'reativar';if(!confirm(`Deseja ${action} este funcionário?`))return;try{await api('/api/staff/'+id,{method:'PATCH',body:JSON.stringify({active:!active})});const b=await api('/api/bootstrap');state.staff=b.staff;toast(active?'Funcionário inativado':'Funcionário reativado');render()}catch(e){toast(e.message)}}
async function printLossReport(){try{const arr=await api('/api/losses');const today=new Date();const isoDay=today.toISOString().slice(0,10);let allowed=arr.filter(x=>String(x.createdAt).slice(0,10)===isoDay);if(state.sector==='Recepção')allowed=allowed.filter(x=>x.type==='Não Reconhecido');else if(state.sector==='Mini Bar')allowed=allowed.filter(x=>['Quebra','Não Conferido'].includes(x.type));else if(state.sector==='Governança')allowed=[];const total=allowed.reduce((a,x)=>a+(Number(x.quantity)||0)*(Number(x.unitPrice)||0),0);const w=window.open('','_blank','width=900,height=700');if(!w)return toast('O navegador bloqueou a janela de impressão.');const rows=allowed.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('pt-BR')}</td><td>${x.type}</td><td>${x.room||'—'}</td><td>${x.product||'—'}</td><td>${x.quantity}</td><td>R$ ${(Number(x.unitPrice)||0).toFixed(2).replace('.',',')}</td><td>${x.responsible||'—'}</td></tr>`).join('');w.document.write(`<html><head><title>Relatório de perdas - Gran Villagio</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#111}h1{margin-bottom:4px}p{color:#555}table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px}th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#eee}.total{font-size:18px;font-weight:bold;margin-top:18px}</style></head><body><h1>Gran Villagio — Relatório de Perdas</h1><p>Data: ${today.toLocaleDateString('pt-BR')} • Setor: ${esc(state.sector)}</p><table><thead><tr><th>Horário</th><th>Tipo</th><th>Apto</th><th>Produto</th><th>Qtd.</th><th>Valor</th><th>Responsável</th></tr></thead><tbody>${rows||'<tr><td colspan="7">Nenhuma perda registrada hoje.</td></tr>'}</tbody></table><div class="total">Total: R$ ${total.toFixed(2).replace('.',',')}</div><script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close()}catch(e){toast(e.message)}}
async function configView(){const pa=state.settings?.floorAssignments||{};let items=[];try{items=await api('/api/admin/config-items')}catch(e){}return `<div class="card"><h2>⚙️ Configuração / Personalização</h2><p class="muted">Área exclusiva do Antonio para ajustar o sistema no futuro, sem precisar alterar o código para mudanças de cadastro, opções, status, mensagens e visibilidade.</p><div class="card" style="box-shadow:none;border:1px solid #e5eaf1;margin:14px 0"><h3>PIN do Antonio</h3><input id="oldpin" type="password" placeholder="PIN atual"><br><br><input id="newpin" type="password" placeholder="Novo PIN"><br><br><button class="primary" onclick="changePin()">Alterar PIN</button></div><div class="card" style="box-shadow:none;border:1px solid #e5eaf1;margin:14px 0"><h3>Senhas dos setores</h3><div class="form"><select id="pssector"><option>Recepção</option><option>Mini Bar</option><option>Governança</option><option>Gerência</option></select><input id="pspass" type="password" placeholder="Nova senha"><button class="primary" onclick="saveSectorPassword()">Salvar senha</button></div><div id="psstatus" class="muted" style="margin-top:12px">Carregando status...</div></div><div class="card" style="box-shadow:none;border:1px solid #e5eaf1;margin:14px 0"><h3>👥 Responsáveis por andar</h3><div class="form"><div><label>6º ao 11º</label><input id="floor611" value="${esc((pa['6-11']||[]).join(', '))}"></div><div><label>13º ao 18º</label><input id="floor1318" value="${esc((pa['13-18']||[]).join(', '))}"></div></div><button class="primary" onclick="saveFloors()" style="margin-top:10px">Salvar divisão</button></div><div class="card" style="box-shadow:none;border:1px solid #e5eaf1;margin:14px 0"><h3>🥤 Produtos e preços</h3><div class="list">${state.products.map((p,i)=>`<div class="item"><span>${esc(p.name)}</span><div class="actions"><input id="pp${i}" type="number" min="0" step="0.01" value="${p.price}" style="width:100px;padding:9px;border:1px solid #d8e0ea;border-radius:9px"><button class="primary" onclick="saveProduct(${i})">Salvar</button></div></div>`).join('')}</div><div class="form" style="margin-top:12px"><input id="newprod" placeholder="Novo produto"><input id="newprice" type="number" min="0" step="0.01" placeholder="Preço"><button class="primary" onclick="addProduct()">Adicionar produto</button></div></div><div class="card" style="box-shadow:none;border:1px solid #e5eaf1"><h3>🧩 Opções configuráveis</h3><p class="muted">Crie, altere, ative ou desative opções que podem ser ajustadas sem mexer no código. O histórico operacional não é apagado.</p><div class="form"><select id="cType"><option value="opcao">Opção</option><option value="status">Status</option><option value="mensagem">Mensagem</option><option value="visibilidade">Visibilidade</option><option value="regra">Regra operacional</option></select><input id="cName" placeholder="Nome da opção"><input id="cDesc" placeholder="Descrição"><select id="cSector"><option>Todos</option><option>Recepção</option><option>Mini Bar</option><option>Governança</option><option>Gerência</option></select><button class="primary" onclick="addConfigItem()">Adicionar</button></div><div class="list" style="margin-top:14px">${items.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><br><span class="muted">${esc(x.type)} • ${esc(x.sector)} • ${x.active?'Ativo':'Inativo'}</span>${x.description?`<br><span class="muted">${esc(x.description)}</span>`:''}</div><div class="actions"><button class="primary" onclick="editConfigItem(${x.id},${JSON.stringify(x.name)},${JSON.stringify(x.description||'')},${JSON.stringify(x.type)},${JSON.stringify(x.sector||'Todos')})">Editar</button><button class="${x.active?'danger':'primary'}" onclick="toggleConfigItem(${x.id},${x.active})">${x.active?'Desativar':'Ativar'}</button></div></div>`).join('')||'<p class="muted">Nenhuma opção cadastrada.</p>'}</div></div></div>`}
async function addConfigItem(){try{const name=$('cName').value.trim();if(!name)return toast('Informe o nome da opção.');await api('/api/admin/config-items',{method:'POST',body:JSON.stringify({type:$('cType').value,name,description:$('cDesc').value,sector:$('cSector').value})});toast('Configuração adicionada');render()}catch(e){toast(e.message)}}
async function editConfigItem(id,name,desc,type,sector){const n=prompt('Nome:',name);if(n===null)return;const d=prompt('Descrição:',desc);if(d===null)return;const s=prompt('Setor (Todos, Recepção, Mini Bar, Governança ou Gerência):',sector);if(s===null)return;try{await api('/api/admin/config-items/'+id,{method:'PATCH',body:JSON.stringify({name:n,description:d,type,sector:s})});toast('Configuração atualizada');render()}catch(e){toast(e.message)}}
async function toggleConfigItem(id,active){if(!confirm(active?'Desativar esta opção?':'Ativar esta opção?'))return;try{await api('/api/admin/config-items/'+id,{method:'PATCH',body:JSON.stringify({active:!active})});toast(active?'Opção desativada':'Opção ativada');render()}catch(e){toast(e.message)}}
async function saveFloors(){try{await api('/api/admin/floors',{method:'POST',body:JSON.stringify({key:'6-11',names:$('floor611').value.split(',').map(x=>x.trim()).filter(Boolean)})});await api('/api/admin/floors',{method:'POST',body:JSON.stringify({key:'13-18',names:$('floor1318').value.split(',').map(x=>x.trim()).filter(Boolean)})});const b=await api('/api/bootstrap');state.settings=b.settings;toast('Divisão dos andares salva');render()}catch(e){toast(e.message)}}
async function saveProduct(i){try{const p=state.products[i];await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:p.name,price:$('pp'+i).value})});const b=await api('/api/bootstrap');state.products=b.products;toast('Preço salvo');render()}catch(e){toast(e.message)}}
async function addProduct(){try{await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:$('newprod').value,price:$('newprice').value})});const b=await api('/api/bootstrap');state.products=b.products;toast('Produto adicionado');render()}catch(e){toast(e.message)}}
async function changePin(){try{await api('/api/admin/pin',{method:'POST',body:JSON.stringify({currentPin:$('oldpin').value,newPin:$('newpin').value})});toast('PIN alterado');render()}catch(e){toast(e.message)}}
async function saveSectorPassword(){try{const sector=$('pssector').value;const password=$('pspass').value;await api('/api/admin/sector-passwords',{method:'POST',body:JSON.stringify({sector,password})});toast(password?'Senha de '+sector+' salva.':'Senha de '+sector+' removida; acesso direto.');render()}catch(e){toast(e.message)}}
async function loadSectorPasswordStatus(){if(state.sector!=='Admin'||state.tab!=='config')return;try{const r=await api('/api/admin/sector-passwords');$('psstatus').innerHTML=r.sectors.map(x=>`${esc(x.sector)}: <b>${x.configured?'senha configurada':'sem senha (entrada direta)'}</b>`).join(' &nbsp;•&nbsp; ')}catch(e){$('psstatus').textContent=e.message}}
async function adminLogin(){if(DEMO_MODE){try{const r=await api('/api/admin/verify',{method:'POST',body:JSON.stringify({pin:'DEMO'})});if(!r.ok)return toast('Modo demonstração indisponível');state.adminToken=r.token;state.sector='Admin';state.user='Antonio';state.tab='dashboard';showApp()}catch(e){toast(e.message)}return}const pin=prompt('Digite o PIN da Administração Antonio:');if(pin===null)return;try{const r=await api('/api/admin/verify',{method:'POST',body:JSON.stringify({pin})});if(!r.ok)return toast('PIN inválido');state.adminToken=r.token;state.sector='Admin';state.user='Antonio';state.tab='dashboard';showApp()}catch(e){toast(e.message)}}
function logout(){location.reload()}
function subscribe(){const es=new EventSource('/api/events?sector='+encodeURIComponent(state.sector));es.onmessage=e=>{try{const x=JSON.parse(e.data);toast(x.title+' • '+x.message);if(state.tab==='config')return;if(state.activeConference)return;render()}catch{}}; if(state.sector==='Recepção'){clearInterval(window.__gvPoll); window.__gvPoll=setInterval(async()=>{if(state.tab==='conferencia'&&!state.activeConference){try{render()}catch{}}},2500)}}
const tutorialMap=[['Recepção','A Recepção concentra as operações de atendimento. O atendente pode ser escolhido no topo sem sair do sistema.'],['Solicitações','Aqui a Recepção envia pedidos ao Mini Bar, como copos, água, reposição ou atendimento urgente.'],['Saídas pendentes','Permite enviar vários apartamentos que precisam ser conferidos pelo Mini Bar.'],['Conferir minibar','Abre a conferência do apartamento. O Mini Bar registra os produtos consumidos e o resultado volta para a Recepção.'],['Prorrogações','Registra quando o hóspede prolonga a estadia para que o apartamento não seja tratado como saída.'],['Ocorrências','Mostra situações em que o acesso ao apartamento não foi possível e permite acompanhar a nova tentativa.'],['Chat','É a comunicação interna entre setores, evitando depender do WhatsApp para as rotinas do hotel.'],['Perdas','Registra e consulta ocorrências de perda conforme a permissão de cada setor.'],['Dashboard','A Gerência acompanha a operação de forma consolidada: pendências, solicitações, ocorrências, perdas e histórico.'],['Equipe','A Administração Antonio pode cadastrar, editar, ativar ou inativar funcionários sem alterar o código.'],['Configuração / Personalização','Área criada para Antonio ajustar funcionários, senhas, produtos, preços, regras, mensagens, status e opções no futuro.'],['Senhas dos setores','Define quais setores exigem senha. No sistema real, isso impede que outro setor entre indevidamente no Mini Bar.'],['Responsáveis por andar','Define quem atende cada faixa de andares do Mini Bar.'],['Produtos e preços','Permite atualizar preços e cadastrar novos produtos do Mini Bar.'],['Opções configuráveis','Permite criar, editar, ativar ou desativar opções sem apagar o histórico operacional.']];
function tutorialFor(text){if(!tutorialEnabled)return;const clean=String(text||'').replace(/^[^\p{L}\p{N}]+/u,'').trim();let hit=tutorialMap.find(([k])=>clean.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(clean.toLowerCase()));if(!hit&&state.tab)hit=tutorialMap.find(([k])=>k.toLowerCase()===label(state.tab).replace(/^[^\p{L}\p{N}]+/u,'').toLowerCase());if(!hit)return;$('tutorialTitle').textContent=hit[0];$('tutorialText').textContent=hit[1];$('tutorialModal').classList.remove('hidden')}
document.addEventListener('click',e=>{if(!tutorialEnabled||e.target.closest('#tutorialModal')||e.target.closest('#tutorialBanner'))return;const b=e.target.closest('button');if(b&&b.textContent.trim())setTimeout(()=>tutorialFor(b.textContent),80)});
function wire(){if(state.sector==='Admin'&&state.tab==='config')setTimeout(loadSectorPasswordStatus,0)}
(async()=>{try{const b=await api('/api/bootstrap');state.rooms=b.rooms;state.products=b.products;state.staff=b.staff;state.settings=b.settings;}catch(e){console.error(e)}})();
</script></body></html>
